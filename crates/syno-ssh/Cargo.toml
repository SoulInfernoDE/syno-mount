[package]
name = "syno-ssh"
description = "SSH keys, host key pinning and key installation over SFTP for Synology NAS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
russh = { version = "0.65.0", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "3.0.1"
serde.workspace = true
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["rt", "time", "net", "macros", "io-util"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
