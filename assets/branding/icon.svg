<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Syno Mount app icon: a shared folder holding a two-bay NAS, locked by SSH. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1f6e"/>
      <stop offset="1" stop-color="#2f7de1"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde6f3"/>
    </linearGradient>
    <linearGradient id="bay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33407e"/>
      <stop offset="1" stop-color="#252f63"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Folder: back with tab, then front -->
  <path d="M 92 150 Q 92 124 118 124 L 206 124 Q 222 124 232 136 L 250 156 L 394 156 Q 420 156 420 182 L 420 360 Q 420 386 394 386 L 118 386 Q 92 386 92 360 Z"
        fill="#ffffff" fill-opacity="0.55"/>
  <rect x="92" y="180" width="328" height="206" rx="26" fill="url(#folder)"/>

  <!-- NAS front with two drive bays -->
  <rect x="178" y="208" width="156" height="150" rx="18" fill="#c9d6ea"/>
  <rect x="194" y="222" width="58" height="104" rx="9" fill="url(#bay)"/>
  <rect x="260" y="222" width="58" height="104" rx="9" fill="url(#bay)"/>
  <rect x="208" y="306" width="30" height="7" rx="3.5" fill="#62d2c4"/>
  <rect x="274" y="306" width="30" height="7" rx="3.5" fill="#62d2c4"/>
  <circle cx="206" cy="342" r="6" fill="#2ec4a6"/>
  <circle cx="226" cy="342" r="6" fill="#2ec4a6"/>

  <!-- SSH lock badge -->
  <circle cx="392" cy="372" r="64" fill="#f6b73c"/>
  <circle cx="392" cy="372" r="64" fill="none" stroke="#ffffff" stroke-width="10"/>
  <path d="M 372 362 L 372 348 Q 372 326 392 326 Q 412 326 412 348 L 412 362"
        fill="none" stroke="#2a1f6e" stroke-width="10" stroke-linecap="round"/>
  <rect x="362" y="358" width="60" height="44" rx="9" fill="#2a1f6e"/>
  <circle cx="392" cy="378" r="7" fill="#f6b73c"/>
</svg>
